</style><style>
.brand{line-height:1.1;padding-top:6px}.brand:before{content:none}.brand strong{font-weight:800;color:#f6fbff}.brand small{display:block;font-size:10px;letter-spacing:1px;color:#8ea5c0;margin:9px 0 0 2px}.build-tag{position:fixed;z-index:20;right:14px;bottom:10px;color:#6e88a4;font:10px ui-monospace,monospace;letter-spacing:.3px;background:#07111dc7;border:1px solid #35516b;padding:5px 8px;border-radius:99px;pointer-events:none}.chat-head b{font-size:16px;letter-spacing:.2px;text-shadow:0 0 13px #62e9e077}.friend b{letter-spacing:.2px}.primary:hover,.send:hover{filter:brightness(1.12);transform:translateY(-1px)}.primary,.send,.icon,.add-friend{transition:transform .16s ease,filter .16s ease,background .16s ease,box-shadow .16s ease}.icon{border:1px solid transparent}.icon:hover{border-color:#4cddda88;box-shadow:0 0 16px #2de9d944}.dialog h2{font-size:22px;letter-spacing:.2px}.dialog p{font-size:13px}.modal.show .dialog{animation:linkloop-pop .18s ease-out}@keyframes linkloop-pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}@media(max-width:700px){.build-tag{right:8px;bottom:7px;font-size:9px}.brand small{display:none}}
</style><style>

.build-tag{position:static;display:block;margin:6px 0 0;padding:0;border:0;background:transparent;color:#a4bdd4;font-size:10px;line-height:1.3}.brand small{display:block}.shell{height:100dvh;min-height:0}.rail,.conversation{min-height:0}.friends{flex:1}.feed{min-height:0}.burn-option{display:flex;align-items:center;gap:4px}.burn-option input{accent-color:#42e8d7}.add-friend{position:relative;z-index:2;touch-action:manipulation;min-height:46px}.modal.show{display:grid!important;z-index:100!important}.dialog{border-radius:22px;background:#101d2e;box-shadow:0 0 0 1px #52e6dc55,0 20px 80px #000}.primary{border-radius:22px;background:linear-gradient(110deg,#75fff0,#36dfd8 55%,#878aff);color:#061b29}.icon{display:grid;place-items:center;border-radius:50%;background:#1a2a3d;border:1px solid #3d6f85}.auth-card{border-radius:24px}.bubble{border-radius:15px}.mine .bubble{background:linear-gradient(110deg,#0c777a,#125662)}@media(max-width:700px){.shell{grid-template-columns:minmax(112px,32%) minmax(0,1fr)}.rail{padding:16px 7px}.brand{font-size:15px;padding:0 3px 18px}.brand strong{display:block;font-size:13px}.brand small{display:block;font-size:9px}.nav-label{display:block}.friend{justify-content:flex-start;gap:5px;padding:8px 4px}.friend .meta{display:block}.friend .avatar{width:30px;height:30px}.friend b{font-size:12px}.friend small{font-size:10px}.add-friend span{display:block;font-size:11px}.burn-option{display:flex;font-size:10px}.composebox{gap:3px;padding-left:6px}.composebox textarea{min-width:0}.chat-head{padding:0 6px}.actions{gap:1px}.icon{width:31px;height:31px;font-size:17px}.person .avatar{display:none}.person b{font-size:13px}.composer{padding:8px 5px}.dialog{width:min(390px,100%);padding:25px}}
</style><style>
.rail{background:#09111ceF;border-right:1px solid #304359;padding:26px 18px}.brand{padding:0 4px 26px}.nav-label{font-size:20px;color:#f8fbff;letter-spacing:.04em;padding:4px 4px 14px}.add-friend{border-radius:18px;background:#142637;box-shadow:inset 0 0 18px #2ff4dd17,0 0 0 1px #4af9e83d;color:#ddffff}.friends{margin-top:14px}.friend{background:#121d2c;border-radius:16px;margin:4px 0;padding:12px 10px}.friend.active{background:#16343c;box-shadow:inset 0 0 0 1px #4af9df8a,0 0 15px #31ddc02b}.avatar{background:#26455b url('/linkloop-background.png') center 83%/300%;border:1px solid #5ba3ad;color:#fff;text-shadow:0 1px 3px #000}.chat-head{background:#08131d;border-bottom:1px solid #293a49}.composer{background:#07121d;border:0;padding:14px 22px 24px}.composebox{background:#142737;border:1px solid #4c8791;box-shadow:inset 0 -4px 18px #28e5d633,0 4px 20px #22d9d825;border-radius:30px;min-height:52px}.send{background:#7a83d9;color:#fff;border-radius:50%;width:42px;height:42px}.dialog{background:#142231;border:1px solid #58e9de77}.dialog input,.field input,.auth-card>input{border-radius:14px;background:#263548;border:1px solid #43556d;padding:13px;color:#eefaff}.auth-card{padding:34px 28px;background:#0d1929e8;border-radius:24px}.wordmark{font-family:system-ui;font-size:27px;letter-spacing:0}.code{border-radius:14px}.bubble{font-size:14px;line-height:1.45}.icon{box-shadow:0 0 12px #34c8be22}.chat-head b,.friend b{color:#f4fbff}.person small{color:#62e8d8}@media(max-width:700px){.rail{padding:16px 6px}.nav-label{font-size:14px;padding:4px}.friend{padding:10px 4px}.composer{padding:8px 6px 14px}.composebox{min-height:47px}.send{width:36px;height:36px;flex:none}.auth-card{width:calc(100% - 36px);max-width:380px}}
</style><style>
#pair.modal.show{position:fixed!important;top:0!important;right:0!important;bottom:0!important;left:0!important;width:100%!important;height:100%!important;height:100dvh!important;display:flex!important;align-items:center;justify-content:center;overflow-y:auto;padding:16px;z-index:9999!important;box-sizing:border-box}#pair .dialog{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}#pair .error{height:auto;min-height:20px}#title:empty,#state:empty{display:none}
@media(max-width:700px){body,.auth{background-image:url('/linkloop-mobile.jpg')}}
</style></head><body>
<section id="auth" class="auth hide"><div class="auth-card"><div class="wordmark">青泡</div><p id="authCopy">使用自己创建的账号登录</p><input id="username" autocomplete="username" placeholder="用户名"><div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="密码"><button id="eye" type="button" class="eye">显示</button></div><div id="authError" class="error"></div><button id="authSubmit" class="primary wide">登录</button><button id="authSwitch" class="switch" type="button">没有账号？注册</button></div></section>
<div class="shell"><aside class="rail"><div class="brand">微域 <strong>LinkLoop</strong><small>私有、安全、轻量沟通</small><span class="build-tag">20261110.4</span></div><div class="nav-label">会话</div><button id="addFriend" type="button" class="add-friend">＋ <span>联系人 / 连接</span></button><div id="contacts" class="friends"></div><button id="logout" type="button" class="logout">退出登录</button></aside><main class="conversation"><header class="chat-head"><div class="person"><div id="headAvatar" class="avatar">微</div><div><b id="title"></b><small id="state"></small></div></div><div class="actions"><button id="audioCall" class="icon" title="语音通话">☎</button><button id="videoCall" class="icon" title="视频通话">▣</button><label class="icon" title="发送文件">＋<input id="file" type="file" hidden></label></div></header><section id="feed" class="feed"><p class="empty">点击左侧「联系人 / 连接」，用邀请码建立私有连接。</p></section><footer class="composer"><div class="composebox"><label class="burn-option"><input id="burn" type="checkbox" checked> 阅后即焚</label><textarea id="text" disabled placeholder="说点什么…"></textarea><button id="send" class="send" disabled>发送</button></div></footer></main></div>
<section id="pair" class="modal" aria-hidden="true"><div class="dialog"><button id="pairClose" class="close" type="button">×</button><h2>添加好友</h2><p>首次使用邀请码配对。配对完成后，好友将一直保留在你的列表中。</p><button id="newCode" type="button" class="primary wide">生成我的邀请码</button><div id="myCode" class="code hide"></div><input id="pairCode" placeholder="输入好友的邀请码，例如 A1B2-C3D4-E5F6"><button id="pairJoin" type="button" class="primary wide">完成配对</button><div id="pairError" class="error"></div></div></section>
<section id="callbox" class="callbox"><div><video id="remote" autoplay playsinline></video><video id="local" class="local" autoplay muted playsinline></video><p id="callStatus">正在连接…</p><p><button id="hang" class="primary hang" type="button">挂断</button></p></div></section>
<style>.voice-input{flex:none;width:33px;height:33px;border:1px solid #417b87;border-radius:50%;background:#193749;color:#b5fff4;cursor:pointer}.voice-input.listening{background:#d14563;color:white;box-shadow:0 0 15px #ef698f}@media(max-width:700px){.voice-input{width:28px;height:28px;font-size:14px}}</style>
<script src="/app.js?v=call-fix-1"></script><script src="/voice-input.js?v=1"></script><script>
/* Kept independent of the application bundle so opening the pairing panel never
   depends on messaging, calls, or a cached bundle finishing successfully. */
(function(){var p=document.getElementById('pair'),b=document.getElementById('addFriend');b.onclick=function(){p.classList.add('show');p.setAttribute('aria-hidden','false')};document.getElementById('pairClose').onclick=function(){p.classList.remove('show');p.setAttribute('aria-hidden','true')};p.addEventListener('click',function(e){if(e.target===p){p.classList.remove('show');p.setAttribute('aria-hidden','true')}})})();
(function(){function request(path,body,done){var x=new XMLHttpRequest();x.open('POST',path,true);x.setRequestHeader('Content-Type','application/json');x.timeout=15000;x.onload=function(){var d={};try{d=JSON.parse(x.responseText)}catch(e){}done(x.status>=200&&x.status<300?null:(d.error||'请求失败，请重试'),d)};x.onerror=function(){done('网络连接失败，请重试')};x.ontimeout=function(){done('请求超时，请重试')};x.send(JSON.stringify(body||{}))}document.getElementById('newCode').onclick=function(){var b=this,e=document.getElementById('pairError');b.disabled=true;e.textContent='正在生成…';request('/api/pair-code',{},function(err,d){b.disabled=false;e.textContent=err||'邀请码有效期为 10 分钟';if(!err){var c=document.getElementById('myCode');c.textContent=d.code;c.classList.remove('hide')}})};document.getElementById('pairJoin').onclick=function(){var b=this,e=document.getElementById('pairError');b.disabled=true;e.textContent='正在配对…';request('/api/pair',{code:document.getElementById('pairCode').value.trim()},function(err){b.disabled=false;e.textContent=err||'配对成功，正在刷新好友列表';if(!err)location.reload()})}})();
</script></body></html>
