<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青泡</title>
<style>
:root{--ink:#171717;--muted:#737373;--line:#dbdbdb;--soft:#fafafa;--blue:#0095f6;--green:#31a24c}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,textarea{font:inherit}.hide{display:none!important}.auth{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#fafafa}.auth-card{width:min(350px,calc(100% - 34px));padding:40px;border:1px solid var(--line);text-align:center;background:#fff}.wordmark{font:700 32px Georgia,serif;letter-spacing:-2px}.auth-card p{color:var(--muted)}.field{position:relative;margin:8px 0}.field input{width:100%;border:1px solid #dbdbdb;border-radius:3px;background:#fafafa;padding:11px 42px 11px 10px}.eye{position:absolute;right:7px;top:8px;background:none;border:0;font-weight:600}.primary{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:9px 14px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.5}.wide{width:100%;margin:10px 0}.switch{border:0;background:none;color:var(--blue);font-weight:600;margin-top:12px}.error{height:18px;color:#ed4956;font-size:12px}.shell{min-height:100vh;max-width:1120px;margin:auto;display:grid;grid-template-columns:260px 1fr}.rail{border-right:1px solid var(--line);padding:28px 12px;display:flex;flex-direction:column}.brand{font:700 28px Georgia,serif;letter-spacing:-2px;padding:0 12px 28px}.nav-label{padding:0 12px 10px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase}.add-friend{width:100%;border:0;background:#fff;text-align:left;border-radius:9px;padding:12px;cursor:pointer;font-weight:600}.add-friend:hover,.friend.active,.friend:hover{background:#f2f2f2}.friends{overflow:auto}.friend{display:flex;gap:11px;align-items:center;border-radius:9px;padding:9px 12px;cursor:pointer}.avatar{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:50%;color:#fff;background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af);font-weight:700}.friend .meta{min-width:0;flex:1}.friend b,.friend small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.friend small{color:var(--muted);margin-top:2px}.online{color:var(--green)!important}.logout{margin-top:auto;border:0;background:none;text-align:left;padding:14px 12px;color:var(--muted);cursor:pointer}.conversation{display:flex;min-width:0;flex-direction:column;background:#fff}.chat-head{height:76px;padding:0 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.person{display:flex;align-items:center;gap:10px}.person .avatar{width:38px;height:38px}.person b,.person small{display:block}.person small{color:var(--muted);font-size:12px}.actions{display:flex;gap:10px}.icon{width:36px;height:36px;border:0;background:none;font-size:21px;cursor:pointer}.icon:hover{background:#f5f5f5;border-radius:50%}.feed{flex:1;overflow:auto;padding:28px max(24px,10%)}.empty{color:var(--muted);text-align:center;margin:20vh auto}.msg{display:flex;gap:8px;max-width:76%;margin:0 0 14px}.msg.mine{margin-left:auto;flex-direction:row-reverse}.msg .avatar{width:30px;height:30px;font-size:11px}.bubble{padding:10px 13px;border-radius:20px;background:#efefef;word-break:break-word;line-height:1.35}.mine .bubble{background:var(--blue);color:white}.burn{border:1px dashed #f58529;cursor:pointer}.stamp,.burnhint{font-size:11px;color:var(--muted);margin:4px 4px 0}.filelink{color:inherit;font-weight:600}.composer{padding:14px 24px;border-top:1px solid var(--line)}.composebox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:24px;padding:5px 8px 5px 14px}.composebox textarea{border:0;outline:0;resize:none;min-height:30px;max-height:90px;flex:1;padding:6px}.attach{font-size:21px;cursor:pointer}.burn-option{font-size:12px;color:var(--muted);white-space:nowrap}.send{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer}.send:disabled{opacity:.4}.modal,.callbox{position:fixed;z-index:60;inset:0;display:none;place-items:center;background:#0008;padding:18px}.modal.show,.callbox.show{display:grid}.dialog{position:relative;width:min(390px,100%);padding:28px;background:#fff;border-radius:12px;box-shadow:0 12px 40px #0004}.dialog h2{margin:0 0 8px}.dialog p{color:var(--muted);line-height:1.55}.close{position:absolute;right:13px;top:12px;border:0;background:none;font-size:24px;cursor:pointer}.code{margin:14px 0;padding:13px;background:#f7f7f7;border-radius:7px;font:700 20px ui-monospace,monospace;text-align:center;letter-spacing:2px}.dialog input{width:100%;border:1px solid var(--line);border-radius:6px;padding:11px;margin:10px 0}.callbox{background:#111e}.callbox video{max-width:88vw;max-height:65vh;background:#000;border-radius:12px}.local{position:fixed;right:25px;bottom:95px;width:125px}.callbox p{color:#fff;text-align:center}.hang{background:#ed4956}@media(max-width:700px){.shell{grid-template-columns:92px 1fr}.rail{padding:18px 6px}.brand{font-size:21px;padding:0 5px 22px}.nav-label,.friend .meta,.add-friend span,.logout{display:none}.add-friend{padding:10px;text-align:center;font-size:22px}.friend{padding:8px;justify-content:center}.chat-head{padding:0 12px}.feed{padding:20px 12px}.composer{padding:10px}.burn-option{display:none}.msg{max-width:90%}}
</style></head><body>
<section id="auth" class="auth"><div class="auth-card"><div class="wordmark">青泡</div><p id="authCopy">使用自己创建的账号登录</p><input id="username" autocomplete="username" placeholder="用户名"><div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="密码"><button id="eye" type="button" class="eye">显示</button></div><div id="authError" class="error"></div><button id="authSubmit" class="primary wide">登录</button><button id="authSwitch" class="switch" type="button">没有账号？注册</button></div></section>
<div class="shell"><aside class="rail"><div class="brand">青泡</div><div class="nav-label">消息</div><button id="addFriend" type="button" class="add-friend">＋ <span>添加好友</span></button><div id="contacts" class="friends"></div><button id="logout" type="button" class="logout">退出登录</button></aside><main class="conversation"><header class="chat-head"><div class="person"><div id="headAvatar" class="avatar">青</div><div><b id="title">选择一位好友</b><small id="state">私密聊天</small></div></div><div class="actions"><button id="audioCall" class="icon" title="语音通话">☎</button><button id="videoCall" class="icon" title="视频通话">▣</button><label class="icon" title="发送文件">＋<input id="file" type="file" hidden></label></div></header><section id="feed" class="feed"><p class="empty">点左侧「添加好友」，输入或生成邀请码开始聊天。</p></section><footer class="composer"><div class="composebox"><label class="burn-option"><input id="burn" type="checkbox" checked> 阅后即焚</label><textarea id="text" disabled placeholder="选择好友后即可发消息"></textarea><button id="send" class="send" disabled>发送</button></div></footer></main></div>
<section id="pair" class="modal" aria-hidden="true"><div class="dialog"><button id="pairClose" class="close" type="button">×</button><h2>添加好友</h2><p>首次使用邀请码配对。配对完成后，好友将一直保留在你的列表中。</p><button id="newCode" type="button" class="primary wide">生成我的邀请码</button><div id="myCode" class="code hide"></div><input id="pairCode" placeholder="输入好友的邀请码，例如 A1B2-C3D4-E5F6"><button id="pairJoin" type="button" class="primary wide">完成配对</button><div id="pairError" class="error"></div></div></section>
<section id="callbox" class="callbox"><div><video id="remote" autoplay playsinline></video><video id="local" class="local" autoplay muted playsinline></video><p id="callStatus">正在连接…</p><p><button id="hang" class="primary hang" type="button">挂断</button></p></div></section>
<script src="/app.js"></script></body></html>
