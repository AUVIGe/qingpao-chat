<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青泡</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3ef;color:#172319;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit}.hide{display:none!important}.auth,.modal,.callbox{position:fixed;z-index:9;inset:0;display:grid;place-items:center;background:#eff6f0}.card{width:min(390px,calc(100% - 28px));padding:28px;background:#fff;border:1px solid #dce7dd;border-radius:18px;box-shadow:0 16px 55px #17391d22}.card h1{margin:14px 0 5px;font-size:22px}.mark{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#28a45e;color:#fff;font-size:21px;font-weight:bold}.hint,.sub{color:#728073}.err{height:20px;color:#b94343;font-size:12px}.card input{width:100%;border:1px solid #d7e2d8;border-radius:9px;padding:11px;margin:5px 0}.btn{border:0;border-radius:9px;padding:10px 15px;background:#28a45e;color:#fff;font-weight:bold;cursor:pointer}.full{width:100%;margin-top:5px}.switch,.logout{border:0;background:none;color:#287346;padding:12px 0;width:100%}.eye{position:absolute;right:8px;top:9px;border:0;border-radius:7px;padding:4px 8px;background:#e9f2ea;color:#287346}.app{display:grid;grid-template-columns:290px 1fr;height:100vh;max-width:1180px;margin:auto;background:#fff}.side{overflow:auto;border-right:1px solid #e2eae3;background:#fbfdfb}.sidehead,.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #e2eae3}.sidehead h2{margin:0;font-size:17px}.plus,.call{border:0;border-radius:9px;width:34px;height:34px;background:#e5f4e8;color:#176f3d;font-size:20px}.contact{margin:3px 7px;padding:11px 9px;display:flex;gap:10px;border-radius:11px;cursor:pointer}.contact.sel,.contact:hover{background:#e9f5eb}.avatar{width:39px;height:39px;flex:none;display:grid;place-items:center;border-radius:12px;background:#61917a;color:#fff;font-weight:bold}.name{font-weight:bold}.online{color:#209752}.main{display:flex;min-width:0;flex-direction:column}.top b{font-size:17px}.tools{display:flex;gap:7px;align-items:center}.logout{width:auto;color:#758176}.feed{overflow:auto;flex:1;padding:25px max(18px,6%)}.empty{text-align:center;color:#869187;margin-top:20vh}.msg{display:flex;gap:8px;max-width:78%;margin-bottom:16px}.msg.mine{margin-left:auto;flex-direction:row-reverse}.msg .avatar{width:30px;height:30px;border-radius:9px;font-size:11px}.bubble{padding:9px 12px;background:#f0f4f1;border-radius:4px 13px 13px;word-break:break-word}.mine .bubble{background:#e1f3e5;border-radius:13px 4px 13px 13px}.burn{border:1px dashed #d58b4c;cursor:pointer}.stamp{margin-top:3px;color:#89948a;font-size:11px}.file{color:#176e3d}.compose{border-top:1px solid #e2eae3;padding:9px 16px}.composebar{display:flex;gap:9px;align-items:center}.compose textarea{flex:1;min-height:38px;max-height:90px;border:0;outline:0;resize:none;padding:8px}.attach{font-size:21px;color:#277343;cursor:pointer}.burnlabel{white-space:nowrap;color:#9b5727;font-size:12px}.modal,.callbox{display:none;background:#10201599}.modal.show,.callbox.show{display:grid}.close{position:absolute;right:15px;top:14px;border:0;border-radius:7px;width:28px;height:28px}.code{margin:12px 0;padding:13px;border-radius:9px;text-align:center;background:#eaf5ec;color:#17633a;font:700 20px ui-monospace;letter-spacing:2px}.callbox{background:#102116ed;color:#fff}.callbox video{max-width:90vw;max-height:62vh;background:#000;border-radius:14px}.local{position:fixed;right:22px;bottom:90px;width:120px}.callbar{text-align:center;margin-top:16px}.hang{background:#d95353}@media(max-width:620px){.app{grid-template-columns:115px 1fr}.sidehead{padding:10px 7px}.sidehead h2{font-size:14px}.contact{justify-content:center;padding:9px 4px}.contact .info{display:none}.side{padding:0 2px}.top{padding:9px}.logout,.burnlabel{display:none}.feed{padding:17px 11px}.msg{max-width:90%}}
</style><body>
<section id="auth" class="auth"><div class="card"><div class="mark">青</div><h1 id="authTitle">登录青泡</h1><p id="authText" class="hint">使用您自己创建的用户名和密码登录。</p><input id="username" autocomplete="username" placeholder="用户名"><div style="position:relative"><input id="password" type="password" autocomplete="current-password" placeholder="密码"><button id="eye" type="button" class="eye">显示</button></div><div id="authError" class="err"></div><button id="authButton" class="btn full">登录</button><button id="authSwitch" class="switch">首次使用？创建账户</button></div></section>
<div class="app"><aside class="side"><div class="sidehead"><h2>好友</h2><button class="plus pairOpen">＋</button></div><div id="contacts"></div></aside><main class="main"><header class="top"><div><b id="title">选择一位好友</b><div id="state" class="sub"></div></div><div class="tools"><button id="audio" class="call">☎</button><button id="video" class="call">▣</button><button class="plus pairOpen">＋</button><button id="logout" class="logout">退出</button></div></header><section id="feed" class="feed"><p class="empty">通过右上角 ＋ 生成或输入配对码，添加好友。</p></section><footer class="compose"><div class="composebar"><label class="attach">＋<input id="file" type="file" hidden></label><label class="burnlabel"><input id="burn" type="checkbox" checked> 阅后即焚</label><textarea id="text" disabled placeholder="选择好友后即可发送消息"></textarea><button id="send" class="btn" disabled>发送</button></div></footer></main></div>
<section id="pair" class="modal"><div class="card"><button class="close" id="pairClose">×</button><h1>添加好友</h1><p class="hint">首次配对后，好友会长期保留在列表中。</p><button id="newCode" class="btn full">生成我的配对码</button><div id="myCode" class="code hide"></div><input id="pairCode" placeholder="输入好友的配对码"><button id="pairJoin" class="btn full">完成配对</button><div id="pairError" class="err"></div></div></section>
<section id="callbox" class="callbox"><div><video id="remote" autoplay playsinline></video><video id="local" class="local" autoplay muted playsinline></video><p id="callStatus" style="text-align:center">正在连接…</p><div class="callbar"><button id="hang" class="btn hang">挂断</button></div></div></section>
<script>(function(){'use strict';var $=function(x){return document.getElementById(x)},me,contacts=[],active,last=0,rendered={},creating=false,loading=false,signalLast=0,peer,stream,callWith;function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}function api(p,o){o=o||{};o.credentials='same-origin';return fetch(p,o).then(function(r){return r.json().catch(function(){return {error:'服务器响应异常'}}).then(function(d){if(!r.ok)throw Error(d.error||'请求失败');return d})})}function auth(){ $('authTitle').textContent=creating?'创建青泡账户':'登录青泡';$('authText').textContent=creating?'用户名 2–30 位；密码至少 8 位。':'使用您自己创建的用户名和密码登录。';$('authButton').textContent=creating?'创建并进入':'登录';$('authSwitch').textContent=creating?'已有账户？去登录':'首次使用？创建账户';$('authError').textContent=''}function login(){var b=$('authButton');b.disabled=true;api(creating?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})}).then(function(){location.replace('/')}).catch(function(e){$('authError').textContent=e.message;b.disabled=false})}function drawContacts(){var h='';contacts.forEach(function(c){h+='<div class="contact '+(active&&active.id===c.id?'sel':'')+'" data-id="'+c.id+'"><div class="avatar">'+esc(c.username.charAt(0))+'</div><div class="info"><div class="name">'+esc(c.username)+'</div><div class="sub '+(c.online?'online':'')+'">● '+(c.online?'在线':'离线')+'</div></div></div>'});$('contacts').innerHTML=h||'<p class="sub" style="padding:12px">还没有好友</p>';var n=$('contacts').querySelectorAll('.contact');for(var i=0;i<n.length;i++)n[i].onclick=function(){choose(Number(this.getAttribute('data-id')))}}function loadContacts(){return api('/api/contacts').then(function(d){contacts=d.contacts;if(active)contacts.forEach(function(c){if(c.id===active.id)active=c});drawContacts();if(active)$('state').textContent=active.online?'● 在线':'● 离线'}).catch(function(){})}function choose(id){contacts.forEach(function(c){if(c.id===id)active=c});last=0;rendered={};$('feed').innerHTML='';$('title').textContent=active.username;$('state').textContent=active.online?'● 在线':'● 离线';$('text').disabled=false;$('send').disabled=false;loadMessages()}function add(m){if(rendered[m.id])return;rendered[m.id]=1;var mine=m.sender_id===me.id,body=m.attachment?'<a class="file" target="_blank" href="/api/attachments/'+encodeURIComponent(m.attachment)+'">📎 '+esc(m.body||'下载文件')+'</a>':esc(m.body).replace(/\n/g,'<br>'),burn=m.burn_on_read&&!mine;$('feed').insertAdjacentHTML('beforeend','<div class="msg '+(mine?'mine':'')+'"><div class="avatar">'+(mine?'我':esc(active.username.charAt(0)))+'</div><div><div class="bubble '+(burn?'burn':'')+'" data-id="'+m.id+'">'+body+'</div>'+(burn?'<div class="sub">点击查看，10 秒后删除</div>':'')+'<div class="stamp">'+new Date(m.created_at*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'</div></div></div>')}function loadMessages(){if(!active||loading)return;loading=true;api('/api/messages?with='+active.id+'&after='+last).then(function(d){d.messages.forEach(function(m){last=Math.max(last,m.id);add(m)});$('feed').scrollTop=$('feed').scrollHeight}).catch(function(){}).then(function(){loading=false})}function send(){var v=$('text').value.trim();if(!v||!active)return;$('send').disabled=true;api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:active.id,body:v,burn:$('burn').checked})}).then(function(){$('text').value='';$('burn').checked=true;loadMessages()}).catch(function(e){alert(e.message)}).then(function(){$('send').disabled=false})}function upload(){var f=$('file').files[0];if(!f||!active)return;if(f.size>20971520)return alert('文件不能超过 20 MB');fetch('/api/attachments',{method:'POST',credentials:'same-origin',headers:{'X-Recipient-Id':String(active.id),'X-File-Name':encodeURIComponent(f.name)},body:f}).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d.error);return d})}).then(loadMessages).catch(function(e){alert(e.message)});$('file').value=''}function sig(kind,p){return api('/api/call-signals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:callWith.id,kind:kind,payload:p})})}function stop(tell){var p=peer,w=callWith;peer=null;callWith=null;if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}$('remote').srcObject=null;$('local').srcObject=null;$('callbox').classList.remove('show');if(tell&&p&&w)api('/api/call-signals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:w.id,kind:'hangup',payload:{}})}).catch(function(){});if(p)p.close()}function media(video){return navigator.mediaDevices.getUserMedia({audio:true,video:video}).then(function(s){stream=s;$('local').srcObject=s;$('callbox').classList.add('show');peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.qq.com:3478'},{urls:'stun:stun.l.google.com:19302'}]});s.getTracks().forEach(function(t){peer.addTrack(t,s)});peer.ontrack=function(e){$('remote').srcObject=e.streams[0]};peer.onicecandidate=function(e){if(e.candidate)sig('ice',e.candidate).catch(function(){})};peer.onconnectionstatechange=function(){if(peer)$('callStatus').textContent=peer.connectionState==='connected'?'通话中':peer.connectionState};return peer})}function call(video){if(!active)return alert('请先选择好友');callWith=active;media(video).then(function(p){return p.createOffer().then(function(o){return p.setLocalDescription(o).then(function(){return sig('offer',{sdp:o,video:video})})})}).then(function(){$('callStatus').textContent='正在呼叫 '+callWith.username+'…'}).catch(function(e){stop(false);alert('无法使用麦克风或摄像头：'+e.message)})}function poll(){if(!me)return;api('/api/call-signals?after='+signalLast).then(function(d){d.signals.forEach(function(s){signalLast=Math.max(signalLast,s.id);var p;try{p=JSON.parse(s.payload)}catch(e){return}var who;contacts.forEach(function(c){if(c.id===s.sender_id)who=c});if(!who)return;if(s.kind==='offer'){if(!confirm(who.username+' 邀请你'+(p.video?'视频':'语音')+'通话，是否接听？')){callWith=who;sig('hangup',{});return}if(peer)stop(true);callWith=who;media(p.video).then(function(pc){return pc.setRemoteDescription(p.sdp).then(function(){return pc.createAnswer()}).then(function(a){return pc.setLocalDescription(a).then(function(){return sig('answer',{sdp:a})})})}).then(function(){$('callStatus').textContent='通话中'}).catch(function(){stop(false)})}else if(callWith&&s.sender_id===callWith.id&&s.kind==='answer'&&peer)peer.setRemoteDescription(p.sdp);else if(callWith&&s.sender_id===callWith.id&&s.kind==='ice'&&peer)peer.addIceCandidate(p).catch(function(){});else if(callWith&&s.sender_id===callWith.id&&s.kind==='hangup')stop(false)})}).catch(function(){})}$('eye').onclick=function(){var p=$('password');p.type=p.type==='password'?'text':'password';$('eye').textContent=p.type==='password'?'显示':'隐藏'};$('authSwitch').onclick=function(){creating=!creating;auth()};$('authButton').onclick=login;$('password').onkeydown=function(e){if(e.key==='Enter')login()};$('send').onclick=send;$('text').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('file').onchange=upload;$('feed').onclick=function(e){var b=e.target.closest('.burn');if(b)api('/api/messages/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:Number(b.getAttribute('data-id'))})}).then(function(d){b.textContent=d.body;b.className='bubble';setTimeout(function(){var x=b.closest('.msg');if(x)x.remove()},10000)}).catch(function(x){b.textContent=x.message})};var os=document.querySelectorAll('.pairOpen');for(var i=0;i<os.length;i++)os[i].onclick=function(){$('pair').classList.add('show')};$('pairClose').onclick=function(){$('pair').classList.remove('show')};$('newCode').onclick=function(){api('/api/pair-code',{method:'POST'}).then(function(d){$('myCode').textContent=d.code;$('myCode').classList.remove('hide')}).catch(function(e){$('pairError').textContent=e.message})};$('pairJoin').onclick=function(){api('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('pairCode').value.trim()})}).then(function(){$('pair').classList.remove('show');loadContacts()}).catch(function(e){$('pairError').textContent=e.message})};$('logout').onclick=function(){api('/api/logout',{method:'POST'}).then(function(){location.replace('/')})};$('audio').onclick=function(){call(false)};$('video').onclick=function(){call(true)};$('hang').onclick=function(){stop(true)};api('/api/me').then(function(d){if(!d.user){auth();return}me=d.user;$('auth').classList.add('hide');loadContacts();setInterval(function(){loadContacts();loadMessages()},3500);setInterval(poll,1200)}).catch(auth)})()</script>
