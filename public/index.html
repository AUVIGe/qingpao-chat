<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青泡</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff4ef;color:#19221b;font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.auth{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,#d9f0dc,#f8fbf8 55%,#e4eee5)}.auth.hide{display:none}.card{width:min(395px,calc(100% - 32px));padding:34px;background:#fff;border:1px solid #e1eae2;border-radius:24px;box-shadow:0 24px 70px #173b2022}.mark{width:46px;height:46px;display:grid;place-items:center;background:#28a45e;color:#fff;border-radius:15px;font-size:22px;font-weight:800}.card h1{font-size:24px;margin:18px 0 5px}.hint{color:#718073;margin:0 0 20px}.card input{width:100%;padding:12px;border:1px solid #dbe5dc;border-radius:10px;margin:0 0 10px;font:inherit}.btn{border:0;background:#28a45e;color:#fff;padding:11px 16px;border-radius:10px;font-weight:700;cursor:pointer}.card .btn{width:100%}.switch{border:0;background:transparent;color:#397953;width:100%;padding:12px 0 0}.err{color:#bf4545;font-size:12px;height:19px}.app{display:grid;grid-template-columns:310px 1fr;width:min(1050px,100vw);height:min(760px,100vh);margin:auto;background:#fff;box-shadow:0 18px 65px #173b2020}.side{background:#fafcf9;border-right:1px solid #e4ebe4;padding:22px 10px;overflow:auto}.sidehead{padding:0 10px 16px;display:flex;align-items:center;justify-content:space-between}.side h2{margin:0;font-size:17px}.add{width:30px;height:30px;border:0;border-radius:9px;background:#e6f4e8;color:#187243;font-size:20px}.contact{padding:11px 9px;display:flex;gap:10px;border-radius:12px;cursor:pointer}.contact.sel,.contact:hover{background:#eaf5ec}.avatar{width:40px;height:40px;flex:none;background:#5d927c;color:#fff;display:grid;place-items:center;border-radius:14px;font-weight:700}.info{min-width:0;flex:1}.name{font-weight:700}.sub{font-size:12px;color:#738075;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.online{color:#28a45e}.main{display:flex;min-width:0;flex-direction:column}.top{height:75px;padding:16px 25px;border-bottom:1px solid #e4ebe4;display:flex;justify-content:space-between;align-items:center}.top b{font-size:16px}.logout{border:0;background:transparent;color:#778277}.feed{flex:1;overflow:auto;padding:28px max(24px,7%)}.empty{color:#849086;text-align:center;margin:20vh auto}.msg{display:flex;gap:9px;margin:0 0 17px;max-width:78%}.msg.me{margin-left:auto;flex-direction:row-reverse}.msg .avatar{width:31px;height:31px;border-radius:10px;font-size:11px}.bubble{background:#f2f5f2;padding:10px 13px;border-radius:4px 14px 14px;word-break:break-word}.me .bubble{background:#e5f5e8;border-radius:14px 4px 14px 14px}.stamp{font-size:11px;color:#849085;margin-top:3px}.compose{border-top:1px solid #e4ebe4;padding:12px 20px}.sendrow{display:flex;gap:10px;align-items:end}textarea{border:0;outline:0;resize:none;min-height:34px;flex:1;font:inherit;padding:7px 0}.modal{position:fixed;inset:0;background:#15211666;z-index:6;display:none;place-items:center;padding:18px}.modal.show{display:grid}.modal .card{position:relative}.close{position:absolute;right:17px;top:17px;border:0;background:#edf2ed;border-radius:8px;width:29px;height:29px}.code{background:#edf6ee;color:#17633a;padding:14px;border-radius:10px;text-align:center;font:700 21px ui-monospace,monospace;letter-spacing:2px;margin:15px 0}.pairinput{text-transform:uppercase}@media(max-width:620px){.app{height:100vh;grid-template-columns:1fr}.side{display:none}.feed{padding:20px 15px}.msg{max-width:88%}}
</style><body>
<section id="auth" class="auth"><div class="card"><div class="mark">青</div><h1 id="authTitle">登录青泡</h1><p id="authText" class="hint">私人小团队通讯，只与已配对好友聊天。</p><input id="username" autocomplete="username" placeholder="用户名"><div style="position:relative"><input id="password" type="password" autocomplete="current-password" placeholder="密码"><button type="button" id="togglePassword" style="position:absolute;right:9px;top:7px;width:auto;padding:5px 7px;background:#edf3ee;color:#397953;font-size:12px">显示</button></div><div id="error" class="err"></div><button id="authSubmit" class="btn">登录</button><button id="switch" class="switch">首次使用？创建账户</button></div></section>
<div class="app"><aside class="side"><div class="sidehead"><h2>好友</h2><button class="add openPair">＋</button></div><div id="contacts"></div></aside><main class="main"><header class="top"><div><b id="title">选择一位好友</b><div id="state" class="sub"></div></div><div style="display:flex;align-items:center;gap:12px"><button class="add openPair" aria-label="添加好友">＋</button><button id="logout" class="logout">退出</button></div></header><section id="feed" class="feed"><p class="empty">通过右上角 ＋ 生成或输入配对码，添加好友。</p></section><footer class="compose"><div class="sendrow"><textarea id="text" placeholder="选择好友后即可发送消息" disabled></textarea><button id="send" class="btn" disabled>发送</button></div></footer></main></div>
<section id="pair" class="modal"><div class="card"><button class="close" data-close="pair">×</button><h1>添加好友</h1><p class="hint">对方在线或离线都可以配对；完成后，双方在线即可聊天。</p><button id="newCode" class="btn">生成我的配对码</button><div id="myCode" class="code" hidden></div><input id="pairCode" class="pairinput" placeholder="输入好友的配对码，例如 A1B2-C3D4-E5F6"><button id="joinCode" class="btn">完成配对</button><div id="pairError" class="err"></div></div></section>
<script>
const $=s=>document.querySelector(s);let me=null,contacts=[],active=null,last=0,register=false;
async function api(path,opt={}){let r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});let d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function esc(s){return String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function stamp(t){return new Date(t*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function authMode(){ $('#authTitle').textContent=register?'创建青泡账户':'登录青泡';$('#authText').textContent=register?'首次使用请创建新账户；用户名 2–30 位，密码至少 8 位。':'请输入在本网站创建的账号。旧版浏览器本地账号不能直接登录。';$('#password').autocomplete=register?'new-password':'current-password';$('#authSubmit').textContent=register?'创建并进入':'登录';$('#switch').textContent=register?'已有账户？去登录':'首次使用？创建账户';$('#error').textContent=''}
async function enter(){try{let d=await api(register?'/api/register':'/api/login',{method:'POST',body:JSON.stringify({username:$('#username').value.trim(),password:$('#password').value})});me=d.user;$('#auth').classList.add('hide');await loadContacts()}catch(e){$('#error').textContent=e.message}}
async function loadContacts(){let d=await api('/api/contacts');contacts=d.contacts;$('#contacts').innerHTML=contacts.map(c=>'<div class="contact '+(active?.id===c.id?'sel':'')+'" data-id="'+c.id+'"><div class="avatar">'+esc(c.username[0])+'</div><div class="info"><div class="name">'+esc(c.username)+'</div><div class="sub '+(c.online?'online':'')+'">'+(c.online?'● 在线':'离线')+'</div></div></div>').join('')||'<p class="sub" style="padding:8px">还没有好友</p>';document.querySelectorAll('.contact').forEach(n=>n.onclick=()=>{active=contacts.find(c=>c.id==n.dataset.id);last=0;loadContacts();loadMessages()});if(active){active=contacts.find(c=>c.id===active.id)||null;$('#state').textContent=active?(active.online?'● 在线':'离线'):''}}
async function loadMessages(){if(!active)return;try{let d=await api('/api/messages?with='+active.id+'&after='+last);for(let m of d.messages){last=m.id;$('#feed').insertAdjacentHTML('beforeend','<div class="msg '+(m.sender_id===me.id?'me':'')+'"><div class="avatar">'+(m.sender_id===me.id?'我':esc(active.username[0]))+'</div><div><div class="bubble">'+esc(m.body).replace(/\n/g,'<br>')+'</div><div class="stamp">'+stamp(m.created_at)+'</div></div></div>')}$('#title').textContent=active.username;$('#text').disabled=false;$('#send').disabled=false;$('#text').placeholder='发消息…（Enter 发送）';$('#feed').scrollTop=99999}catch(e){console.error(e)}}
async function send(){let body=$('#text').value.trim();if(!body||!active)return;try{await api('/api/messages',{method:'POST',body:JSON.stringify({to:active.id,body})});$('#text').value='';await loadMessages()}catch(e){alert(e.message)}}
async function boot(){let d=await api('/api/me');if(d.user){me=d.user;$('#auth').classList.add('hide');loadContacts()}else authMode()}
$('#authSubmit').onclick=enter;$('#switch').onclick=()=>{register=!register;authMode()};$('#password').onkeydown=e=>{if(e.key==='Enter')enter()};$('#send').onclick=send;$('#text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.querySelectorAll('.openPair').forEach(b=>b.onclick=()=>$('#pair').classList.add('show'));document.querySelector('[data-close]').onclick=()=>$('#pair').classList.remove('show');$('#newCode').onclick=async()=>{try{let d=await api('/api/pair-code',{method:'POST'});$('#myCode').hidden=false;$('#myCode').textContent=d.code}catch(e){$('#pairError').textContent=e.message}};$('#joinCode').onclick=async()=>{try{await api('/api/pair',{method:'POST',body:JSON.stringify({code:$('#pairCode').value})});$('#pair').classList.remove('show');$('#pairCode').value='';await loadContacts()}catch(e){$('#pairError').textContent=e.message}};$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};setInterval(()=>{loadContacts();loadMessages()},4000);boot();
const callStyle=document.createElement('style');callStyle.textContent='.callbtn{border:0;background:#e6f4e8;color:#187243;width:30px;height:30px;border-radius:9px;font-size:15px}.callbox{position:fixed;z-index:9;inset:0;background:#102116e8;color:#fff;display:none;place-items:center}.callbox.show{display:grid}.callbox video{max-width:90vw;max-height:62vh;background:#000;border-radius:14px}.callbar{display:flex;gap:12px;justify-content:center;margin-top:16px}.callbar button{border:0;border-radius:99px;padding:12px 20px;background:#e95353;color:#fff;font-weight:700}@media(max-width:620px){.app{grid-template-columns:106px 1fr}.side{display:block;padding:12px 5px}.sidehead{padding:0 5px 12px}.side h2{font-size:14px}.contact{padding:8px 4px}.contact .info{display:none}.avatar{width:38px;height:38px}.top{padding:12px}.top b{font-size:15px}.logout{display:none}.feed{padding:18px 12px}.empty{margin:14vh auto}.compose{padding:10px}}';document.head.append(callStyle);
document.querySelector('.top > div:last-child').insertAdjacentHTML('afterbegin','<button class="callbtn" id="audioCall" title="语音通话">☎</button><button class="callbtn" id="videoCall" title="视频通话">▣</button>');
document.body.insertAdjacentHTML('beforeend','<section id="callbox" class="callbox"><div><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline style="position:fixed;right:20px;bottom:86px;width:110px;border:1px solid #fff"></video><p id="callStatus" style="text-align:center">正在连接…</p><div class="callbar"><button id="hangup">挂断</button></div></div></section>');
let peer=null,media=null,signalLast=0,callWith=null;
async function signal(kind,payload){return api('/api/call-signals',{method:'POST',body:JSON.stringify({to:callWith.id,kind,payload})})}
async function mediaStart(video){media=await navigator.mediaDevices.getUserMedia({audio:true,video});$('#localVideo').srcObject=media;$('#callbox').classList.add('show')}
async function peerStart(video){await mediaStart(video);peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});media.getTracks().forEach(t=>peer.addTrack(t,media));peer.ontrack=e=>$('#remoteVideo').srcObject=e.streams[0];peer.onicecandidate=e=>{if(e.candidate)signal('ice',e.candidate)};peer.onconnectionstatechange=()=>{$('#callStatus').textContent=peer?.connectionState==='connected'?'通话中':peer?.connectionState||'正在连接'};}
async function call(video){if(!active)return alert('请先选择好友');callWith=active;try{await peerStart(video);let o=await peer.createOffer();await peer.setLocalDescription(o);await signal('offer',{sdp:o,video});$('#callStatus').textContent='正在呼叫 '+active.username+'…'}catch(e){endCall();alert('无法打开麦克风或摄像头：'+e.message)}}
async function pollSignals(){if(!active)return;try{let d=await api('/api/call-signals?with='+active.id+'&after='+signalLast);for(const s of d.signals){signalLast=s.id;let p=JSON.parse(s.payload);if(s.kind==='offer'){if(!confirm(active.username+' 邀请你'+(p.video?'视频':'语音')+'通话，是否接听？')){callWith=active;await signal('hangup',{});continue}callWith=active;await peerStart(p.video);await peer.setRemoteDescription(p.sdp);let a=await peer.createAnswer();await peer.setLocalDescription(a);await signal('answer',{sdp:a});$('#callStatus').textContent='通话中'}else if(s.kind==='answer'&&peer){await peer.setRemoteDescription(p.sdp)}else if(s.kind==='ice'&&peer){try{await peer.addIceCandidate(p)}catch(_){}}else if(s.kind==='hangup'){endCall()}}}catch(_){}}
async function endCall(){try{if(peer&&callWith)await signal('hangup',{});}catch(_){};if(peer)peer.close();peer=null;if(media)media.getTracks().forEach(t=>t.stop());media=null;callWith=null;$('#remoteVideo').srcObject=null;$('#localVideo').srcObject=null;$('#callbox').classList.remove('show')}
$('#audioCall').onclick=()=>call(false);$('#videoCall').onclick=()=>call(true);$('#hangup').onclick=endCall;setInterval(pollSignals,1500);
$('#togglePassword').onclick=()=>{let p=$('#password');p.type=p.type==='password'?'text':'password';$('#togglePassword').textContent=p.type==='password'?'显示':'隐藏'};
</script>
